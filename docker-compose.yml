# ============================================================
# Game Support Agent Docker Compose 配置
# 同时启动 RAG服务 + 本项目
# ============================================================

version: '3.8'

services:
  # ==================== RAG 服务 ====================
  rag-service:
    image: enterprise-rag:latest
    container_name: game-support-rag
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
    volumes:
      - rag-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - game-support-network

  # ==================== Agent API 服务 ====================
  agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: game-support-agent
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - RAG_SERVICE_URL=http://rag-service:8000
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-qwen-turbo}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - HIL_ENABLED=${HIL_ENABLED:-true}
      - API_KEY=${API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - rag-service
    networks:
      - game-support-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== Streamlit Web UI ====================
  web-ui:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: game-support-web
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://agent-api:8002/api/v1
    depends_on:
      - agent-api
    networks:
      - game-support-network

volumes:
  rag-data:
    driver: local

networks:
  game-support-network:
    driver: bridge
