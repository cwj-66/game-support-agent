# ============================================================
# Game Support Agent Docker Compose
# mysql + redis + agent-api + web-ui 同一项目，一条命令一起启动：
#   docker compose up -d
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: game-support-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: game_support
      MYSQL_USER: game_support
      MYSQL_PASSWORD: game_support_pass
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack-server:latest
    container_name: game-support-redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_ARGS=--appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  rag-service:
    image: enterprise-rag:latest
    container_name: game-support-rag
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
    volumes:
      - rag-data:/app/data
    restart: unless-stopped

  agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: game-support-agent-api
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - RAG_SERVICE_URL=http://rag-service:8000
      - REDIS_URL=redis://redis:6379/0
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-qwen-turbo}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - HIL_ENABLED=${HIL_ENABLED:-true}
      - API_KEY=${API_KEY}
      - GAME_JWT_SECRET=${GAME_JWT_SECRET}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=game_support
      - MYSQL_PASSWORD=game_support_pass
      - MYSQL_DATABASE=game_support
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped

  web-ui:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: game-support-web
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://agent-api:8002/api/v1
    depends_on:
      - agent-api
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  rag-data:
