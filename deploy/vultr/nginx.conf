# Installed at /etc/nginx/sites-available/game-support-demo.
# Keep the public demo offline until local services and demo data are verified.
server {
    listen 80;
    server_name chenwj.click www.chenwj.click;
    charset utf-8;
    server_tokens off;
    client_max_body_size 2m;

    error_page 502 503 504 =503 /demo-offline.html;
    location = /demo-offline.html {
        internal;
        root /var/www/game-support-demo;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
    }

    location / {
        if (!-f /var/www/game-support-demo/live.enabled) {
            return 503;
        }
        proxy_pass http://127.0.0.1:15175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 必须用 $remote_addr 覆盖（而不是追加）转发头，丢弃客户端自带的伪造值。
        # 线上若由作品集站点的 Nginx 反代到 127.0.0.1:15177，该站点配置也要保持同样写法。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_intercept_errors on;
    }
}
